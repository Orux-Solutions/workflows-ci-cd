name: Orux PR Quality

on:
  workflow_call:
    inputs:
      project-type:
        description: Supported project profile
        type: string
        required: false
        default: node-frontend
      node-version:
        description: Node.js major version
        type: string
        required: false
        default: "22"
      run-codeql:
        description: Run CodeQL when Advanced Security is enabled for the repository; otherwise keep it skipped
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ inputs.project-type }}
    runs-on: [self-hosted, linux, x64, orux-ci]
    timeout-minutes: 15
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout shared CI
        uses: actions/checkout@v4
        with:
          repository: Orux-Solutions/workflows-ci-cd
          ref: main
          path: .orux-ci
          token: ${{ github.token }}
          persist-credentials: false
      - name: Validate module manifests (shared CI repository)
        if: github.repository == 'Orux-Solutions/workflows-ci-cd'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/validate-manifests.sh
      - name: Validate module manifests (consumer repository)
        if: github.repository != 'Orux-Solutions/workflows-ci-cd'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .orux-ci/scripts/validate-manifests.sh
      - name: Validate project profile
        env:
          PROJECT_TYPE: ${{ inputs.project-type }}
        run: |
          case "${PROJECT_TYPE}" in
            node-backend|node-frontend|node-pages|docs|shared-ci) ;;
            *) echo "Perfil desconocido: ${PROJECT_TYPE}" >&2; exit 1 ;;
          esac
      - name: Setup Node.js
        if: inputs.project-type == 'node-backend' || inputs.project-type == 'node-frontend' || inputs.project-type == 'node-pages'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Install dependencies
        if: inputs.project-type == 'node-backend' || inputs.project-type == 'node-frontend' || inputs.project-type == 'node-pages'
        run: npm ci --ignore-scripts
      - name: Run backend lint
        if: inputs.project-type == 'node-backend'
        run: npm run lint --if-present
      - name: Run frontend lint when available
        if: inputs.project-type == 'node-frontend'
        run: npm run lint --if-present
      - name: Run format check when available
        if: inputs.project-type == 'node-backend' || inputs.project-type == 'node-frontend' || inputs.project-type == 'node-pages'
        run: npm run format:check --if-present
      - name: Run application checks
        if: inputs.project-type == 'node-pages'
        run: npm run check
      - name: Generate Prisma client
        if: inputs.project-type == 'node-backend'
        run: npx --no-install prisma generate
      - name: Run tests
        if: inputs.project-type == 'node-backend' || inputs.project-type == 'node-pages'
        run: npm test --if-present
      - name: Run backend coverage
        if: inputs.project-type == 'node-backend'
        run: npm run test:cov --if-present
      - name: Upload coverage artifact
        if: always() && inputs.project-type == 'node-backend'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.event.repository.name }}-${{ github.sha }}
          path: coverage/
          if-no-files-found: ignore
      - name: Build application
        if: inputs.project-type == 'node-backend' || inputs.project-type == 'node-frontend'
        run: npm run build
      - name: Build Docker image
        if: inputs.project-type == 'node-pages'
        run: docker build --tag "${{ github.event.repository.name }}:test" .
      - name: Test shared release scripts
        if: inputs.project-type == 'shared-ci' || inputs.project-type == 'node-backend' || inputs.project-type == 'node-frontend' || inputs.project-type == 'node-pages'
        run: .orux-ci/scripts/test-release-scripts.sh

  dependency-audit:
    name: Audit dependencies
    if: inputs.project-type == 'node-backend' || inputs.project-type == 'node-frontend' || inputs.project-type == 'node-pages'
    runs-on: [self-hosted, linux, x64, orux-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  conventional-commits:
    name: Validate commits
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, x64, orux-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Orux-Solutions/workflows-ci-cd
          ref: main
          path: .orux-ci
          token: ${{ github.token }}
          persist-credentials: false
      - name: Validate commit messages
        run: .orux-ci/scripts/validate-commits.sh "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, x64, orux-ci]
    timeout-minutes: 5
    steps:
      - name: Check Dependency Graph availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh api "/repos/${GITHUB_REPOSITORY}" --jq '.security_and_analysis.dependency_graph.status // "disabled"' 2>/dev/null || echo disabled)"
          if [[ "${status}" == "enabled" ]]; then
            echo 'supported=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'supported=false' >> "${GITHUB_OUTPUT}"
            echo "Dependency Graph is ${status}; using npm audit as the available fallback."
          fi
      - name: Review dependency changes
        if: steps.dependency-graph.outputs.supported == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
      - name: Record unsupported Dependency Review
        if: steps.dependency-graph.outputs.supported != 'true'
        run: echo 'Dependency Review skipped because GitHub Dependency Graph is disabled; dependency-audit remains required for Node projects.'

  codeql:
    name: CodeQL
    if: inputs.run-codeql && (inputs.project-type == 'node-backend' || inputs.project-type == 'node-frontend' || inputs.project-type == 'node-pages') && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4

  gitleaks:
    name: Detect secrets
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, orux-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          version=8.24.2
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            --output /tmp/gitleaks.tar.gz
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf /tmp/gitleaks.tar.gz -C "${RUNNER_TEMP}/bin" gitleaks
          chmod 0755 "${RUNNER_TEMP}/bin/gitleaks"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Scan changed commits for secrets
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            range="${{ github.event.before }}..${GITHUB_SHA}"
          else
            range="HEAD~1..HEAD"
          fi
          gitleaks git --redact --exit-code 1 --log-opts="${range}"

  governance:
    name: Governance metadata
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout shared CI
        uses: actions/checkout@v4
        with:
          repository: Orux-Solutions/workflows-ci-cd
          ref: main
          path: .orux-ci
          token: ${{ github.token }}
          persist-credentials: false
      - name: Validate governance metadata
        uses: actions/github-script@v7
        with:
          script: |
            const { validateGovernance } = await import(`${process.cwd()}/.orux-ci/scripts/validate-governance.mjs`);
            await validateGovernance({ github, context, core });

  pr-report:
    name: PR Quality Report
    if: always()
    needs:
      [
        validate,
        dependency-audit,
        conventional-commits,
        dependency-review,
        codeql,
        gitleaks,
        governance,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Publish PR report
        uses: actions/github-script@v7
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const marker = '<!-- orux-ci-report -->';
            const results = JSON.parse(process.env.NEEDS_JSON);
            const labels = {
              validate: 'Validate',
              'dependency-audit': 'Dependency audit',
              'conventional-commits': 'Commit policy',
              'dependency-review': 'Dependency review',
              codeql: 'CodeQL',
              gitleaks: 'Secret scan',
              governance: 'Governance'
            };
            const icon = value => value === 'success' ? '✅' : value === 'skipped' ? '⏭️' : '❌';
            const rows = Object.entries(results).filter(([name]) => labels[name]).map(([name, value]) => `| ${labels[name]} | ${icon(value.result)} ${value.result} |`).join('\n');
            const failed = Object.values(results).some(value => ['failure', 'cancelled', 'timed_out'].includes(value.result));
            const body = `${marker}\n## Orux · PR Quality\n\n| Check | Estado |\n|---|---|\n${rows}\n\n${failed ? '⛔ Se solicitaron cambios porque falló un check obligatorio.' : '✅ Todos los checks obligatorios pasaron; listo para revisión humana.'}\n\n[Ver ejecución](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            if (context.eventName === 'pull_request') {
              const comments = await github.paginate(github.rest.issues.listComments, { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100 });
              const existing = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
              if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
              else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
              const reviews = await github.paginate(github.rest.pulls.listReviews, { owner: context.repo.owner, repo: context.repo.repo, pull_number: context.issue.number, per_page: 100 });
              const botReview = reviews.find(review => review.user?.type === 'Bot' && review.commit_id === context.sha && review.state === 'CHANGES_REQUESTED');
              if (failed) {
                if (!botReview) await github.rest.pulls.createReview({ owner: context.repo.owner, repo: context.repo.repo, pull_number: context.issue.number, event: 'REQUEST_CHANGES', body: 'Los checks obligatorios de Orux tienen fallos. Revisá el comentario de PR Quality y corregí los checks marcados.' });
              } else if (botReview) {
                await github.rest.pulls.dismissReview({ owner: context.repo.owner, repo: context.repo.repo, pull_number: context.issue.number, review_id: botReview.id, message: 'Los checks de Orux volvieron a pasar.' });
              }
            }
            if (failed) core.setFailed('Uno o más checks obligatorios fallaron.');
