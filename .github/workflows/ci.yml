name: Aurea CI

on:
  workflow_call:
    inputs:
      project-type:
        description: Supported project profile
        type: string
        required: false
        default: node-frontend
      node-version:
        description: Node.js major version
        type: string
        required: false
        default: '22'

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ inputs.project-type }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout shared CI
        uses: actions/checkout@v4
        with:
          repository: aurea-io/aurea-ci
          ref: main
          path: .aurea-ci
          token: ${{ github.token }}
          persist-credentials: false
      - name: Validate module manifests (shared CI repository)
        if: github.repository == 'aurea-io/aurea-ci'
        run: scripts/validate-manifests.sh
      - name: Validate module manifests (consumer repository)
        if: github.repository != 'aurea-io/aurea-ci'
        run: .aurea-ci/scripts/validate-manifests.sh
      - name: Validate project profile
        env:
          PROJECT_TYPE: ${{ inputs.project-type }}
        run: |
          case "${PROJECT_TYPE}" in
            node-backend|node-frontend|node-pages|docs|shared-ci) ;;
            *) echo "Perfil desconocido: ${PROJECT_TYPE}" >&2; exit 1 ;;
          esac
      - name: Setup Node.js
        if: inputs.project-type == 'node-backend' || inputs.project-type == 'node-frontend' || inputs.project-type == 'node-pages'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Install dependencies
        if: inputs.project-type == 'node-backend' || inputs.project-type == 'node-frontend' || inputs.project-type == 'node-pages'
        run: npm ci --ignore-scripts
      - name: Run backend lint
        if: inputs.project-type == 'node-backend'
        run: npm run lint
      - name: Run application checks
        if: inputs.project-type == 'node-pages'
        run: npm run check
      - name: Generate Prisma client
        if: inputs.project-type == 'node-backend'
        run: npx --no-install prisma generate
      - name: Run tests
        if: inputs.project-type == 'node-backend' || inputs.project-type == 'node-pages'
        run: npm test
      - name: Run backend coverage
        if: inputs.project-type == 'node-backend'
        run: npm run test:cov --if-present
      - name: Upload coverage artifact
        if: always() && inputs.project-type == 'node-backend'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.event.repository.name }}-${{ github.sha }}
          path: coverage/
          if-no-files-found: ignore
      - name: Build application
        if: inputs.project-type == 'node-backend' || inputs.project-type == 'node-frontend'
        run: npm run build
      - name: Build Docker image
        if: inputs.project-type == 'node-pages'
        run: docker build --tag "${{ github.event.repository.name }}:test" .
      - name: Test shared release scripts
        if: inputs.project-type == 'shared-ci' || inputs.project-type == 'node-backend' || inputs.project-type == 'node-frontend' || inputs.project-type == 'node-pages'
        run: .aurea-ci/scripts/test-release-scripts.sh
