name: Aurea Commit Policy
on: { workflow_call: {} }
permissions: { contents: read }
jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Load shared CI scripts
        uses: actions/checkout@v4
        with:
          repository: aurea-io/aurea-ci
          ref: main
          path: .aurea-ci
          token: ${{ github.token }}
          persist-credentials: false
      - name: Validate commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            range="${BEFORE_SHA}..${HEAD_SHA}"
          elif git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            range="HEAD~1..HEAD"
          else
            range="HEAD"
          fi
          .aurea-ci/scripts/validate-commits.sh "${range}"
  summary:
    name: Workflow summary
    if: ${{ always() }}
    needs: [conventional-commits]
    runs-on: ubuntu-latest
    steps:
      - name: Write workflow summary
        if: ${{ always() }}
        run: |
          {
            echo "## Workflow summary"
            echo "- Workflow: ${GITHUB_WORKFLOW}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "| Job | Estado | Motivo |"
            echo "| --- | --- | --- |"
            echo "| `conventional-commits` | `${{ needs.conventional-commits.result }}` | `${{ needs.conventional-commits.result == 'success' && 'Completado correctamente' || needs.conventional-commits.result == 'failure' && 'Falló; revisar los logs del job' || needs.conventional-commits.result == 'skipped' && 'Omitido porque no se cumplió su condición' || format('Resultado: {0}', needs.conventional-commits.result) }}` |"
          } >> "$GITHUB_STEP_SUMMARY"
