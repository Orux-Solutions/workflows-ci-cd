name: Aurea Commit Policy
on: { workflow_call: {} }
permissions: { contents: read }
jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Load shared CI scripts
        uses: actions/checkout@v4
        with:
          repository: aurea-io/aurea-ci
          ref: v1
          path: .aurea-ci
          token: ${{ github.token }}
          persist-credentials: false
      - name: Validate commit messages
        run: .aurea-ci/scripts/validate-commits.sh "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
