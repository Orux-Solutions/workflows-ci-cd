name: Aurea Docker Publish
on:
  workflow_call:
    inputs:
      image: { required: true, type: string }
      version: { required: true, type: string }
    secrets: {}
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ inputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ inputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: AUREA_COMMIT_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  notify-telegram:
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          [[ -z "${TELEGRAM_BOT_TOKEN}" || -z "${TELEGRAM_CHAT_ID}" ]] && exit 0
          message=$(printf 'Aurea publicada 🚀\nRepo: %s\nVersión: %s\nCommit: %.7s' "${GITHUB_REPOSITORY}" "${{ inputs.version }}" "${GITHUB_SHA}")
          IFS='|' read -ra ids <<< "${TELEGRAM_CHAT_ID}"
          for chat_id in "${ids[@]}"; do
            chat_id="$(echo "${chat_id}" | xargs)"; [[ -z "${chat_id}" ]] && continue
            curl --fail --silent --show-error --request POST --data-urlencode "chat_id=${chat_id}" --data-urlencode "text=${message}" "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          done
  notify-discord:
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          message=$(printf 'Aurea publicada 🚀\nRepo: %s\nVersión: %s\nCommit: %.7s' "${GITHUB_REPOSITORY}" "${{ inputs.version }}" "${GITHUB_SHA}")
          payload="$(printf '%s' "${message}" | python3 -c 'import json,sys; print(json.dumps({"content": sys.stdin.read()}))')"
          if [[ -n "${DISCORD_BOT_TOKEN}" && -n "${DISCORD_CHANNEL_ID}" ]]; then
            curl --fail --silent --show-error --request POST --header "Authorization: Bot ${DISCORD_BOT_TOKEN}" --header 'content-type: application/json' --data "${payload}" "https://discord.com/api/v10/channels/${DISCORD_CHANNEL_ID}/messages"
          elif [[ -n "${DISCORD_WEBHOOK_URL}" ]]; then
            curl --fail --silent --show-error --request POST --header 'content-type: application/json' --data "${payload}" "${DISCORD_WEBHOOK_URL}"
          fi
