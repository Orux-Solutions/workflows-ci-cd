name: Aurea Docker Publish
on:
  workflow_call:
    inputs:
      image: { required: true, type: string }
      version: { required: true, type: string }
    secrets: {}
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ inputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ inputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: AUREA_COMMIT_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  notify:
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    uses: aurea-io/aurea-ci/.github/workflows/notify.yml@v2
    with:
      event-type: image
      image: ${{ inputs.image }}
      version: ${{ inputs.version }}
    secrets: inherit
  summary:
    name: Workflow summary
    if: ${{ always() }}
    needs: [publish, notify]
    runs-on: ubuntu-latest
    steps:
      - name: Write workflow summary
        if: ${{ always() }}
        run: |
          {
            echo "## Workflow summary"
            echo "- Workflow: ${GITHUB_WORKFLOW}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "| Job | Estado | Motivo |"
            echo "| --- | --- | --- |"
            echo "| `publish` | `${{ needs.publish.result }}` | `${{ needs.publish.result == 'success' && 'Completado correctamente' || needs.publish.result == 'failure' && 'Falló; revisar los logs del job' || needs.publish.result == 'skipped' && 'Omitido porque no se cumplió su condición' || format('Resultado: {0}', needs.publish.result) }}` |"
            echo "| `notify` | `${{ needs.notify.result }}` | `${{ needs.notify.result == 'success' && 'Completado correctamente' || needs.notify.result == 'failure' && 'Falló; revisar los logs del job' || needs.notify.result == 'skipped' && 'Omitido porque no se cumplió su condición' || format('Resultado: {0}', needs.notify.result) }}` |"
          } >> "$GITHUB_STEP_SUMMARY"
