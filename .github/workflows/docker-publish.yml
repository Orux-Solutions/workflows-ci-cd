name: Orux Docker Publish
on:
  workflow_call:
    inputs:
      image: { required: true, type: string }
      version: { required: true, type: string }
      ref: { required: false, default: "", type: string }
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on:
      group: Default
      labels: [self-hosted, linux, x64, orux-buildkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
        with:
          driver: remote
          endpoint: tcp://buildkit:1234
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ inputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ inputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            io.orux.release=${{ inputs.version }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            APP_VERSION=${{ inputs.version }}
            ORUX_COMMIT_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  notify:
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    uses: Orux-Solutions/workflows-ci-cd/.github/workflows/notify.yml@main
    with:
      event-type: image
      image: ${{ inputs.image }}
      version: ${{ inputs.version }}
    secrets: inherit
