name: Aurea Governance

on:
  workflow_call:

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shared CI
        uses: actions/checkout@v4
        with:
          repository: aurea-io/aurea-ci
          ref: main
          path: .aurea-ci
          token: ${{ github.token }}
          persist-credentials: false

      - name: Validate governance metadata
        uses: actions/github-script@v7
        with:
          script: |
            const { validateGovernance } = await import(`${process.cwd()}/.aurea-ci/scripts/validate-governance.mjs`);
            await validateGovernance({ github, context, core });
