name: Aurea Governance

on:
  workflow_call:

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shared CI
        uses: actions/checkout@v4
        with:
          repository: aurea-io/aurea-ci
          ref: main
          path: .aurea-ci
          token: ${{ github.token }}
          persist-credentials: false

      - name: Validate governance metadata
        uses: actions/github-script@v7
        with:
          script: |
            const { validateGovernance } = await import(`${process.cwd()}/.aurea-ci/scripts/validate-governance.mjs`);
            await validateGovernance({ github, context, core });
  summary:
    name: Workflow summary
    if: ${{ always() }}
    needs: [governance]
    runs-on: ubuntu-latest
    steps:
      - name: Write workflow summary
        if: ${{ always() }}
        run: |
          {
            echo "## Workflow summary"
            echo "- Workflow: ${GITHUB_WORKFLOW}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "| Job | Estado | Motivo |"
            echo "| --- | --- | --- |"
            echo "| `governance` | `${{ needs.governance.result }}` | `${{ needs.governance.result == 'success' && 'Completado correctamente' || needs.governance.result == 'failure' && 'Falló; revisar los logs del job' || needs.governance.result == 'skipped' && 'Omitido porque no se cumplió su condición' || format('Resultado: {0}', needs.governance.result) }}` |"
          } >> "$GITHUB_STEP_SUMMARY"
