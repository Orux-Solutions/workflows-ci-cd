name: Orux Governance

on:
  workflow_call:

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shared CI
        uses: actions/checkout@v4
        with:
          repository: Orux-Solutions/orux-ci
          ref: main
          path: .orux-ci
          token: ${{ github.token }}
          persist-credentials: false

      - name: Validate governance metadata
        uses: actions/github-script@v7
        with:
          script: |
            const { validateGovernance } = await import(`${process.cwd()}/.orux-ci/scripts/validate-governance.mjs`);
            await validateGovernance({ github, context, core });
  summary:
    if: ${{ always() }}
    needs: [governance]
    uses: ./.github/workflows/workflow-summary.yml
    with:
      needs_json: ${{ toJSON(needs) }}
