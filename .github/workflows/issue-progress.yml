name: Issue progress automation

on:
  issues:
    types: [opened, edited, reopened]
  pull_request:
    types: [opened, edited, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  governance:
    uses: aurea-io/aurea-ci/.github/workflows/governance.yml@main
