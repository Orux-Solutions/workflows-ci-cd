name: Orux Manifest Validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout shared CI
        uses: actions/checkout@v4
        with:
          repository: Orux-Solutions/orux-ci
          ref: main
          path: .orux-ci
          token: ${{ github.token }}
          persist-credentials: false
      - name: Validate module manifests
        run: .orux-ci/scripts/validate-manifests.sh
  summary:
    if: ${{ always() }}
    needs: [manifests]
    uses: ./.github/workflows/workflow-summary.yml
    with:
      needs_json: ${{ toJSON(needs) }}
