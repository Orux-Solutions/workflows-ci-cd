name: Aurea Notifications

on:
  workflow_call:
    secrets:
      TELEGRAM_BOT_TOKEN: { required: false }
      TELEGRAM_CHAT_ID: { required: false }
      DISCORD_BOT_TOKEN: { required: false }
      DISCORD_CHANNEL_ID: { required: false }
      DISCORD_WEBHOOK_URL: { required: false }
    inputs:
      event-type:
        description: Notification event (image or deploy)
        required: true
        type: string
      image:
        description: Published image name
        required: false
        default: ''
        type: string
      version:
        description: Published version
        required: false
        default: ''
        type: string
      environment:
        description: Deployment environment
        required: false
        default: production
        type: string
      deploy-url:
        description: Optional deployed URL
        required: false
        default: ''
        type: string
      source-commit:
        description: Commit that produced the artifact or deployment
        required: false
        default: ''
        type: string
      status:
        description: Result of the operation
        required: false
        default: success
        type: string
      reason:
        description: Reason when an operation is skipped or fails
        required: false
        default: ''
        type: string
      commit-message:
        description: Commit message that triggered the operation
        required: false
        default: ''
        type: string
      discord-message-id:
        description: Existing Discord message to update instead of creating a new one
        required: false
        default: ''
        type: string
    outputs:
      discord-message-id:
        description: Discord message ID created or updated by this workflow
        value: ${{ jobs.notify.outputs.discord-message-id }}

permissions:
  contents: read

jobs:
  notify:
    name: Notify ${{ inputs.event-type }}
    runs-on: ubuntu-latest
    if: ${{ inputs.event-type == 'image' || inputs.event-type == 'deploy' }}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      EVENT_TYPE: ${{ inputs.event-type }}
      IMAGE: ${{ inputs.image }}
      VERSION: ${{ inputs.version }}
      ENVIRONMENT: ${{ inputs.environment }}
      DEPLOY_URL: ${{ inputs.deploy-url }}
      SOURCE_COMMIT: ${{ inputs.source-commit || github.sha }}
      STATUS: ${{ inputs.status }}
      REASON: ${{ inputs.reason }}
      COMMIT_MESSAGE: ${{ inputs.commit-message || github.event.head_commit.message || 'workflow dispatch' }}
      DISCORD_MESSAGE_ID: ${{ inputs.discord-message-id }}
    outputs:
      discord-message-id: ${{ steps.discord.outputs.message-id }}
    steps:
      - name: Build notification message
        id: message
        shell: bash
        run: |
          set -euo pipefail
          commit_id="${SOURCE_COMMIT}"
          repository_name="${GITHUB_REPOSITORY##*/}"
          commit_message="${COMMIT_MESSAGE:-workflow dispatch}"
          commit_message="${commit_message%%$'\n'*}"
          commit_message="${commit_message//$'\r'/ }"
          result_label="📦 Publicado"
          [[ "${EVENT_TYPE}" == "deploy" && "${STATUS}" == "success" ]] && result_label="🚀 Publicado y deployado"
          [[ "${EVENT_TYPE}" == "deploy" && "${STATUS}" == "failure" ]] && result_label="⚠️ Publicado con error en deploy"
          [[ "${EVENT_TYPE}" == "deploy" && "${STATUS}" == "skipped" ]] && result_label="⏭️ Publicado (deploy omitido)"
          [[ "${EVENT_TYPE}" == "image" && "${STATUS}" == "failure" ]] && result_label="❌ Error al publicar"
          if [[ "${EVENT_TYPE}" == "image" ]]; then
            printf -v message 'Aurea · %s\nRepo: %s\nImagen: %s\nVersión: %s\nCommit: %s\nMensaje: %s' \
              "${result_label}" "${GITHUB_REPOSITORY}" "${IMAGE}" "${VERSION}" "${commit_id}" "${commit_message}"
          else
            printf -v message ':rocket: %s %s %s - %s' \
              "${repository_name}" "${VERSION}" "${result_label#* }" "${commit_message}"
          fi
          [[ -n "${REASON}" ]] && message+=$'\nMotivo: '${REASON}
          {
            echo 'message<<AUREA_MESSAGE'
            echo "${message}"
            echo 'AUREA_MESSAGE'
          } >> "${GITHUB_OUTPUT}"
      - name: Notify Telegram
        continue-on-error: true
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        env:
          MESSAGE: ${{ steps.message.outputs.message }}
        shell: bash
        run: |
          set -euo pipefail
          IFS='|' read -ra ids <<< "${TELEGRAM_CHAT_ID}"
          for chat_id in "${ids[@]}"; do
            chat_id="$(echo "${chat_id}" | xargs)"
            [[ -z "${chat_id}" ]] && continue
            curl --fail --silent --show-error --request POST \
              --data-urlencode "chat_id=${chat_id}" \
              --data-urlencode "text=${MESSAGE}" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          done
      - name: Notify Discord
        id: discord
        continue-on-error: true
        if: ${{ (env.DISCORD_BOT_TOKEN != '' && env.DISCORD_CHANNEL_ID != '') || env.DISCORD_WEBHOOK_URL != '' }}
        env:
          MESSAGE: ${{ steps.message.outputs.message }}
          DISCORD_MESSAGE_ID: ${{ inputs.discord-message-id }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n --arg content "${MESSAGE}" '{content: $content}')"
          response=""
          if [[ -n "${DISCORD_MESSAGE_ID}" ]]; then
            if [[ -n "${DISCORD_BOT_TOKEN}" && -n "${DISCORD_CHANNEL_ID}" ]]; then
              curl --fail --silent --show-error --request PATCH \
                --header "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
                --header 'content-type: application/json' \
                --data "${payload}" \
                "https://discord.com/api/v10/channels/${DISCORD_CHANNEL_ID}/messages/${DISCORD_MESSAGE_ID}" >/dev/null
            else
              curl --fail --silent --show-error --request PATCH \
                --header 'content-type: application/json' \
                --data "${payload}" \
                "${DISCORD_WEBHOOK_URL}/messages/${DISCORD_MESSAGE_ID}" >/dev/null
            fi
            echo "message-id=${DISCORD_MESSAGE_ID}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "${DISCORD_BOT_TOKEN}" && -n "${DISCORD_CHANNEL_ID}" ]]; then
            response="$(curl --fail --silent --show-error --request POST \
              --header "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
              --header 'content-type: application/json' \
              --data "${payload}" \
              "https://discord.com/api/v10/channels/${DISCORD_CHANNEL_ID}/messages")"
          else
            response="$(curl --fail --silent --show-error --request POST \
              --header 'content-type: application/json' \
              --data "${payload}" "${DISCORD_WEBHOOK_URL}?wait=true")"
          fi
          message_id="$(jq -r '.id // empty' <<<"${response}")"
          [[ -n "${message_id}" ]] || { echo 'Discord no devolvió el ID del mensaje.' >&2; exit 1; }
          echo "message-id=${message_id}" >> "$GITHUB_OUTPUT"
  summary:
    if: ${{ always() }}
    needs: [notify]
    uses: ./.github/workflows/workflow-summary.yml
    with:
      needs_json: ${{ toJSON(needs) }}
