name: Aurea Release
on:
  workflow_call:
    inputs:
      docker-workflow: { type: string, default: '' }
      version-input: { type: string, default: version }
      deploy-url: { type: string, default: '' }
permissions:
  contents: write
  actions: write
concurrency:
  group: release-main-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: true }
      - name: Load shared CI scripts
        uses: actions/checkout@v4
        with:
          repository: aurea-io/aurea-ci
          ref: v1
          path: .aurea-ci
          token: ${{ github.token }}
          persist-credentials: false
      - name: Validate commit messages
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          range="HEAD~1..HEAD"
          if [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then range="${BEFORE_SHA}..${GITHUB_SHA}"; fi
          .aurea-ci/scripts/validate-commits.sh "${range}"
      - name: Calculate next version
        id: version
        run: |
          set -euo pipefail
          version=$(.aurea-ci/scripts/calculate-version.sh)
          if [[ -z "${version}" ]]; then echo "release=false" >> "${GITHUB_OUTPUT}"; exit 0; fi
          echo "release=true" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Create tag and GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" "${GITHUB_SHA}" -m "Release ${tag}"
          git push origin "${tag}"
          notes="Release ${tag}\n\nCommit: ${GITHUB_SHA}"
          if [[ -n "${{ inputs.deploy-url }}" ]]; then notes+="\nDemo/deploy: ${{ inputs.deploy-url }}"; fi
          gh release create "${tag}" --target "${GITHUB_SHA}" --title "${tag}" --notes "${notes}" --generate-notes
          if [[ -n "${{ inputs.docker-workflow }}" ]]; then
            gh workflow run "${{ inputs.docker-workflow }}" --ref "${tag}" --field "${{ inputs.version-input }}=${VERSION}"
          fi
          {
            echo "## Aurea release evidence"
            echo "- Version: ${tag}"
            echo "- Commit: ${GITHUB_SHA}"
            if [[ -n "${{ inputs.deploy-url }}" ]]; then echo "- Demo/deploy: ${{ inputs.deploy-url }}"; fi
            echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
          } >> "${GITHUB_STEP_SUMMARY}"
