name: Orux Release

on:
  workflow_call:
    secrets:
      ORUX_RELEASE_TOKEN:
        required: true

permissions:
  actions: write
  contents: write

concurrency:
  group: release-main-${{ github.repository }}
  cancel-in-progress: false

jobs:
  calculate-version:
    name: Calculate and validate release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Load shared CI scripts
        uses: actions/checkout@v5
        with:
          repository: Orux-Solutions/workflows-ci-cd
          ref: main
          path: .orux-ci
          token: ${{ github.token }}
          persist-credentials: false
      - name: Validate commit messages
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          range="HEAD~1..HEAD"
          if [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then range="${BEFORE_SHA}..HEAD"; fi
          .orux-ci/scripts/validate-commits.sh "${range}"
      - name: Calculate next version
        id: version
        run: |
          set -euo pipefail
          version=$(.orux-ci/scripts/calculate-version.sh)
          if [[ -z "${version}" ]]; then
            echo 'release=false' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo 'release=true' >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  create-tag:
    name: Create immutable release tag
    needs: calculate-version
    if: needs.calculate-version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, persist-credentials: true }
      - name: Create and push tag
        id: tag
        env:
          VERSION: ${{ needs.calculate-version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if git show-ref --tags --verify --quiet "refs/tags/${tag}"; then
            echo "Release tag ${tag} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" "${GITHUB_SHA}" -m "Release ${tag}"
          git push origin "${tag}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  create-release:
    name: Create GitHub release
    needs: [calculate-version, create-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.ORUX_RELEASE_TOKEN }}
          TAG: ${{ needs.create-tag.outputs.tag }}
        run: |
          set -euo pipefail
          notes="Release ${TAG}\\n\\nCommit: ${GITHUB_SHA}"
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "${TAG}" --notes "${notes}" --generate-notes
          {
            echo "## Orux release evidence"
            echo "- Version: ${TAG}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          } >> "${GITHUB_STEP_SUMMARY}"
