name: Aurea Release

on:
  workflow_call:
    inputs:
      deploy-url:
        description: Optional deployed URL included in release evidence
        required: false
        default: ''
        type: string
      deploy-workflow:
        description: Workflow to dispatch after publishing the release
        required: false
        default: deploy.yml
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: release-main-${{ github.repository }}
  cancel-in-progress: false

jobs:
  calculate-version:
    name: Calculate and validate release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Load shared CI scripts
        uses: actions/checkout@v5
        with:
          repository: aurea-io/aurea-ci
          ref: 370e25f9400b9aac6818fbdfea93daeee85620af
          path: .aurea-ci
          token: ${{ github.token }}
          persist-credentials: false
      - name: Validate commit messages
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          range="HEAD~1..HEAD"
          if [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then range="${BEFORE_SHA}..HEAD"; fi
          .aurea-ci/scripts/validate-commits.sh "${range}"
      - name: Calculate next version
        id: version
        run: |
          set -euo pipefail
          version=$(.aurea-ci/scripts/calculate-version.sh)
          if [[ -z "${version}" ]]; then
            echo 'release=false' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo 'release=true' >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  create-tag:
    name: Create immutable release tag
    needs: calculate-version
    if: needs.calculate-version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, persist-credentials: true }
      - name: Create and push tag
        id: tag
        env:
          VERSION: ${{ needs.calculate-version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if git show-ref --tags --verify --quiet "refs/tags/${tag}"; then
            echo "Release tag ${tag} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" "${GITHUB_SHA}" -m "Release ${tag}"
          git push origin "${tag}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  create-release:
    name: Create GitHub release
    needs: [calculate-version, create-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create-tag.outputs.tag }}
          DEPLOY_URL: ${{ inputs.deploy-url }}
          DEPLOY_WORKFLOW: ${{ inputs.deploy-workflow }}
        run: |
          set -euo pipefail
          notes="Release ${TAG}\\n\\nCommit: ${GITHUB_SHA}"
          [[ -n "${DEPLOY_URL}" ]] && notes+="\\nDemo/deploy: ${DEPLOY_URL}"
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "${TAG}" --notes "${notes}" --generate-notes
          if [[ -n "${DEPLOY_WORKFLOW}" ]]; then
            gh workflow run "${DEPLOY_WORKFLOW}" --repo "${GITHUB_REPOSITORY}" --ref "${TAG}" -f "release-tag=${TAG}"
          fi
          {
            echo "## Aurea release evidence"
            echo "- Version: ${TAG}"
            echo "- Commit: ${GITHUB_SHA}"
            [[ -n "${DEPLOY_URL}" ]] && echo "- Demo/deploy: ${DEPLOY_URL}"
            echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          } >> "${GITHUB_STEP_SUMMARY}"
  summary:
    name: Workflow summary
    if: ${{ always() }}
    needs: [calculate-version, create-tag, create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Write workflow summary
        if: ${{ always() }}
        run: |
          {
            echo "## Workflow summary"
            echo "- Workflow: ${GITHUB_WORKFLOW}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "| Job | Estado | Motivo |"
            echo "| --- | --- | --- |"
            echo "| `calculate-version` | `${{ needs.calculate-version.result }}` | `${{ needs.calculate-version.result == 'success' && 'Completado correctamente' || needs.calculate-version.result == 'failure' && 'Falló; revisar los logs del job' || needs.calculate-version.result == 'skipped' && 'Omitido porque no se cumplió su condición' || format('Resultado: {0}', needs.calculate-version.result) }}` |"
            echo "| `create-tag` | `${{ needs.create-tag.result }}` | `${{ needs.create-tag.result == 'success' && 'Completado correctamente' || needs.create-tag.result == 'failure' && 'Falló; revisar los logs del job' || needs.create-tag.result == 'skipped' && 'Omitido porque no se cumplió su condición' || format('Resultado: {0}', needs.create-tag.result) }}` |"
            echo "| `create-release` | `${{ needs.create-release.result }}` | `${{ needs.create-release.result == 'success' && 'Completado correctamente' || needs.create-release.result == 'failure' && 'Falló; revisar los logs del job' || needs.create-release.result == 'skipped' && 'Omitido porque no se cumplió su condición' || format('Resultado: {0}', needs.create-release.result) }}` |"
          } >> "$GITHUB_STEP_SUMMARY"
