name: Aurea Security
on:
  workflow_call:
    inputs:
      project-type:
        description: Project profile
        required: false
        default: node-frontend
        type: string
permissions:
  contents: read
  security-events: write
jobs:
  repository-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v4
        if: inputs.project-type == 'node-backend' || inputs.project-type == 'node-frontend' || inputs.project-type == 'node-pages'
        with: { node-version: '22', cache: npm }
      - run: npm ci --ignore-scripts
        if: inputs.project-type == 'node-backend' || inputs.project-type == 'node-frontend' || inputs.project-type == 'node-pages'
      - name: Audit npm dependencies
        if: inputs.project-type == 'node-backend' || inputs.project-type == 'node-frontend' || inputs.project-type == 'node-pages'
        run: npm audit --omit=dev --audit-level=high
      - name: Capture development dependency audit
        if: inputs.project-type == 'node-backend' || inputs.project-type == 'node-frontend' || inputs.project-type == 'node-pages'
        run: npm audit --include=dev --json > npm-audit.json || true
      - name: Upload dependency audit report
        if: always() && (inputs.project-type == 'node-backend' || inputs.project-type == 'node-frontend' || inputs.project-type == 'node-pages')
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ github.event.repository.name }}-${{ github.sha }}
          path: npm-audit.json
          if-no-files-found: ignore
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          version=8.24.2
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            --output /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan changed commits for secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}..${GITHUB_SHA}"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            range="${{ github.event.before }}..${GITHUB_SHA}"
          else
            range="HEAD~1..HEAD"
          fi
          gitleaks git --redact --exit-code 1 --log-opts="${range}"

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check Dependency Graph availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh api "/repos/${GITHUB_REPOSITORY}" --jq '.security_and_analysis.dependency_graph.status // "disabled"' 2>/dev/null || echo disabled)"
          if [[ "${status}" == "enabled" ]]; then
            echo 'supported=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'supported=false' >> "${GITHUB_OUTPUT}"
            echo "Dependency Graph is ${status}; using npm audit as the available fallback."
          fi
      - name: Review dependency changes
        if: steps.dependency-graph.outputs.supported == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
      - name: Record unsupported Dependency Review
        if: steps.dependency-graph.outputs.supported != 'true'
        run: echo 'Dependency Review skipped because GitHub Dependency Graph is disabled; dependency-audit remains required for Node projects.'

  codeql:
    name: CodeQL
    if: (inputs.project-type == 'node-backend' || inputs.project-type == 'node-frontend' || inputs.project-type == 'node-pages') && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3
  summary:
    if: ${{ always() }}
    needs: [repository-security, dependency-review, codeql]
    uses: ./.github/workflows/workflow-summary.yml
    with:
      needs_json: ${{ toJSON(needs) }}
