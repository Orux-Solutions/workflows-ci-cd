name: Shared CI self-test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test shared release scripts
        run: ./scripts/test-release-scripts.sh
      - name: Test manifest validation
        run: ./scripts/test-manifest-validation.sh
  summary:
    if: ${{ always() }}
    needs: [scripts]
    uses: ./.github/workflows/workflow-summary.yml
    with:
      needs_json: ${{ toJSON(needs) }}
