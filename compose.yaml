name: orux

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command:
      - bash
      - -c
      - |
        if [ ! -f /data/db/mongo-keyfile ]; then
          openssl rand -base64 756 > /data/db/mongo-keyfile
          chmod 400 /data/db/mongo-keyfile
          chown 999:999 /data/db/mongo-keyfile
        fi
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/db/mongo-keyfile --bind_ip_all
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-orux}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    volumes:
      - mongo-data:/data/db
    ports: ["127.0.0.1:${MONGO_PORT:-27017}:27017"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u ${MONGO_ROOT_USERNAME:-orux} -p ${MONGO_ROOT_PASSWORD} --authenticationDatabase admin --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongo:27017\" }] }).ok }' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports: ["0.0.0.0:${PROMETHEUS_PORT:-9090}:9090"]

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["0.0.0.0:${GRAFANA_PORT:-3000}:3000"]

  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    ports: ["0.0.0.0:${PORTAINER_PORT:-9000}:9000"]

  business-backend:
    image: ${BUSINESS_BACKEND_IMAGE:-ghcr.io/orux-solutions/backoffice-be-orux}:${BUSINESS_BACKEND_VERSION:-latest}
    build:
      context: ../business-backend
      args:
        ORUX_COMMIT_ID: ${BUSINESS_BACKEND_COMMIT:-unknown}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      FRONTEND_URL: https://business.orux.ar
      DATABASE_URL: mongodb://${MONGO_ROOT_USERNAME:-orux}:${MONGO_ROOT_PASSWORD}@mongo:27017/orux?authSource=admin&replicaSet=rs0
      APP_VERSION: ${BUSINESS_BACKEND_VERSION:-v2.1.0}
      ORUX_TAG: ${BUSINESS_BACKEND_VERSION:-v2.1.0}
      ORUX_COMMIT_ID: ${BUSINESS_BACKEND_COMMIT:-unknown}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-orux_jwt_access_secret_production_key_2026}
      JWT_ACCESS_EXPIRES_IN: "15m"
      JWT_REFRESH_EXPIRES_IN: "7d"
    depends_on:
      mongo: { condition: service_healthy }
    ports: ["0.0.0.0:${BUSINESS_BACKEND_PORT:-3001}:3001"]

  admin-backend:
    image: ${ADMIN_BACKEND_IMAGE:-ghcr.io/orux-solutions/orux-admin-backend}:${ADMIN_BACKEND_VERSION:-latest}
    build:
      context: ../admin-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      FRONTEND_URL: https://admin.orux.ar
      DATABASE_URL: mongodb://${MONGO_ROOT_USERNAME:-orux}:${MONGO_ROOT_PASSWORD}@mongo:27017/orux?authSource=admin&replicaSet=rs0
      APP_VERSION: ${ADMIN_BACKEND_VERSION:-v2.2.0}
      ORUX_TAG: ${ADMIN_BACKEND_VERSION:-v2.2.0}
      ORUX_COMMIT_ID: ${ADMIN_BACKEND_COMMIT:-unknown}
      BUSINESS_BACKEND_URL: http://business-backend:3001
      CLIENT_BACKEND_URL: http://client-backend:3003
      ADMIN_FRONTEND_VERSION: ${ADMIN_FRONTEND_VERSION:-v2.2.0}
      BUSINESS_FRONTEND_VERSION: ${BUSINESS_FRONTEND_VERSION:-v2.1.0}
      CLIENT_FRONTEND_VERSION: ${CLIENT_FRONTEND_VERSION:-v2.1.0}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-orux_jwt_access_secret_production_key_2026}
      JWT_ACCESS_EXPIRES_IN: "1h"
      JWT_REFRESH_EXPIRES_IN: "7d"
    depends_on:
      mongo: { condition: service_healthy }
    ports: ["0.0.0.0:${ADMIN_BACKEND_PORT:-3002}:3002"]

  client-backend:
    image: ${CLIENT_BACKEND_IMAGE:-ghcr.io/orux-solutions/orux-client-backend}:${CLIENT_BACKEND_VERSION:-latest}
    build:
      context: ../client-backend
      args:
        ORUX_COMMIT_ID: ${CLIENT_BACKEND_COMMIT:-unknown}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3003
      CLIENT_FRONTEND_URL: https://orux.ar
      DATABASE_URL: mongodb://${MONGO_ROOT_USERNAME:-orux}:${MONGO_ROOT_PASSWORD}@mongo:27017/orux?authSource=admin&replicaSet=rs0
      APP_VERSION: ${CLIENT_BACKEND_VERSION:-v2.1.0}
      ORUX_TAG: ${CLIENT_BACKEND_VERSION:-v2.1.0}
      ORUX_COMMIT_ID: ${CLIENT_BACKEND_COMMIT:-unknown}
    depends_on:
      mongo: { condition: service_healthy }
    ports: ["0.0.0.0:${CLIENT_BACKEND_PORT:-3003}:3003"]

  business-frontend:
    image: ${BUSINESS_FRONTEND_IMAGE:-ghcr.io/orux-solutions/backoffice-fe-orux}:${BUSINESS_FRONTEND_VERSION:-latest}
    build:
      context: ../business-frontend
      args:
        ORUX_BUSINESS_API: ${ORUX_BUSINESS_API:-https://business-api.orux.ar/api}
        APP_VERSION: ${BUSINESS_FRONTEND_VERSION:-v2.1.0}
    restart: unless-stopped
    ports: ["0.0.0.0:${BUSINESS_FRONTEND_PORT:-8083}:80"]

  admin-frontend:
    image: ${ADMIN_FRONTEND_IMAGE:-ghcr.io/orux-solutions/orux-admin-frontend}:${ADMIN_FRONTEND_VERSION:-latest}
    build:
      context: ../admin-frontend
      args:
        ORUX_ADMIN_API: ${ORUX_ADMIN_API:-https://admin-api.orux.ar/api}
        APP_VERSION: ${ADMIN_FRONTEND_VERSION:-v2.2.0}
    restart: unless-stopped
    ports: ["0.0.0.0:${ADMIN_FRONTEND_PORT:-8084}:80"]

  client-frontend:
    image: ${CLIENT_FRONTEND_IMAGE:-ghcr.io/orux-solutions/orux-client-frontend}:${CLIENT_FRONTEND_VERSION:-latest}
    build:
      context: ../client-frontend
      args:
        ORUX_CLIENT_API: ${ORUX_CLIENT_API:-https://api.orux.ar/api}
        ORUX_BUSINESS_API: ${ORUX_BUSINESS_API:-https://business-api.orux.ar/api}
        APP_VERSION: ${CLIENT_FRONTEND_VERSION:-v2.1.0}
    restart: unless-stopped
    ports: ["0.0.0.0:${CLIENT_FRONTEND_PORT:-8082}:80"]

volumes:
  mongo-data:
  prometheus-data:
  grafana-data:
  portainer-data:
