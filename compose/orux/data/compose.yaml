services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command:
      - bash
      - -c
      - |
        if [ ! -f /data/db/mongo-keyfile ]; then
          openssl rand -base64 756 > /data/db/mongo-keyfile
          chmod 400 /data/db/mongo-keyfile
          chown 999:999 /data/db/mongo-keyfile
        fi
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/db/mongo-keyfile --bind_ip_all
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-orux}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh -u ${MONGO_ROOT_USERNAME:-orux} -p ${MONGO_ROOT_PASSWORD}
          --authenticationDatabase admin --quiet
          --eval 'try { rs.status().ok } catch (e) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] }).ok }'
          | grep 1
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mongo-data:
