# Callers mínimos para cada repositorio Orux.
# La calidad, seguridad y política de commits viven en un único workflow reusable.

name: Orux · PR Quality
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: pr-quality-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write
jobs:
  quality:
    uses: Orux-Solutions/workflows-ci-cd/.github/workflows/ci.yml@main
    with:
      # node-backend | node-frontend | node-pages | docs | shared-ci
      project-type: node-frontend
      # Circuit breaker manual opcional:
      # force-github-hosted: true
    secrets:
      ORUX_RUNNER_OBSERVER_APP_ID: ${{ secrets.ORUX_RUNNER_OBSERVER_APP_ID }}
      ORUX_RUNNER_OBSERVER_PRIVATE_KEY: ${{ secrets.ORUX_RUNNER_OBSERVER_PRIVATE_KEY }}

---
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  release:
    uses: Orux-Solutions/workflows-ci-cd/.github/workflows/release.yml@main
    secrets:
      ORUX_RELEASE_TOKEN: ${{ secrets.ORUX_RELEASE_TOKEN }}

---
name: Publish Docker image
on:
  release:
    types: [published]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    uses: Orux-Solutions/workflows-ci-cd/.github/workflows/docker-publish.yml@main
    with:
      image: ghcr.io/orux-solutions/REPOSITORY_NAME
      version: ${{ github.event.release.tag_name }}
      ref: ${{ github.event.release.tag_name }}
    secrets: inherit
