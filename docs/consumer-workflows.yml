# Callers mínimos para cada repositorio Orux.
# La calidad, seguridad y política de commits viven en un único workflow reusable.

name: Orux · PR Quality
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: pr-quality-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write
jobs:
  quality:
    uses: Orux-Solutions/workflows-ci-cd/.github/workflows/ci.yml@main
    with:
      # node-backend | node-frontend | node-pages | docs | shared-ci
      project-type: node-frontend

---
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  release:
    uses: Orux-Solutions/workflows-ci-cd/.github/workflows/release.yml@main
    secrets: inherit

---
name: Publish Docker image
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Release tag to publish
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  publish:
    uses: Orux-Solutions/workflows-ci-cd/.github/workflows/docker-publish.yml@main
    with:
      image: ghcr.io/orux-solutions/REPOSITORY_NAME
      version: ${{ inputs.release-tag || github.event.release.tag_name }}
      ref: ${{ inputs.release-tag || github.event.release.tag_name || github.ref }}
    secrets: inherit
